services:
  tempmanager.db:
    image: postgres
    hostname: db
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    networks:
      - tempmanager-nat
        # ipv4_address: "192.168.80.11"
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  tempmanager.web:
    image: ${DOCKER_REGISTRY-}tempmanagerweb
    hostname: web
    build:
      context: .
      dockerfile: TempManager.Web/Dockerfile
    environment:
      - "ConnectionStrings__TempManagerContext=Host=db;Database=temp.manager;Username=postgres;Password=example"
    networks:
      - tempmanager-nat
        # ipv4_address: "192.168.80.12"
    depends_on:
     - "tempmanager.db"

networks:
  tempmanager-nat:
    # driver: bridge
    # ipam:
    #   config:
    #     - subnet: 192.168.80.0/24

volumes:
  postgres: