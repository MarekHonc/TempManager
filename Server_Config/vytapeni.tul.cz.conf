<VirtualHost *:80>
   ServerName "vytapeni.tul.cz"
   Redirect permanent "/" "https://vytapeni.tul.cz/"
   RedirectMatch permanent ^/(.*)$ https://vytapeni.tul.cz/$1
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin marek.honc@tul.cz
    ServerName vytapeni.tul.cz
    ServerAlias www.vytapeni.tul.cz
    DocumentRoot /var/www/html/vytapeni.tul.cz
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/vytapeni.tul.cz/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vytapeni.tul.cz/privkey.pem

    <Location />
        AuthType            shibboleth
        Require             shibboleth
        ShibRequestSetting  requireSession  1
    </Location>

    <Location /updateHub>       
        ProxyPass ws://localhost:8080/updateHub
        ProxyPassReverse ws://localhost:8080/updateHub
    </Location>

    # Reverse Proxy na backend
    ProxyPreserveHost On
    ProxyPass / http://localhost:8080/
    ProxyPassReverse / http://localhost:8080/

    # Bezpečnostní hlavičky
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    # Shibbo hodnoty
    RequestHeader set uid %{persistent-id}e
    RequestHeader set givenName %{givenName}e
    RequestHeader set sn %{sn}e
    RequestHeader set mail %{mail}e
    RequestHeader set affiliation %{affiliation}e
    RequestHeader set eppn %{eppn}e
    RequestHeader set ShibSessionIndex %{ShibSessionIndex}e
</VirtualHost>